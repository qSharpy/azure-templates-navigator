trigger:
  branches:
    include:
      - main

# ============================================================
# Cross-repository templates (template: x.yml@alias)
#
# Nothing to clone by hand. When you hover a "@templates" line the
# navigator resolves the repository in this order:
#
#   1. repositories.localPaths setting / .azure-templates-navigator.json
#   2. a clone next to this repo:  ../<repo-name>
#   3. its cache: ~/.azure-templates-navigator/repos/<host>/<org>/.../<ref>
#      (downloaded automatically with your normal git credentials;
#       if auto-fetch is off, the hover shows a "Fetch repository" link)
#
# For type: git (Azure Repos) the organization/project are taken from this
# repo's git remote, or from the azureDevOpsOrganization/Project settings.
# For type: github the URL is https://github.com/<name>.
#
# To try it locally without a real remote, point the alias at the sample
# folder in .azure-templates-navigator.json:
#   { "repositories": { "localPaths": { "templates": "." } } }
# ============================================================
resources:
  repositories:
    - repository: templates
      type: git
      name: myorg/azure-pipeline-samples
      ref: refs/heads/main

stages:
  # ============================================================
  # BUILD STAGE — template lives in the "templates" external repo
  # Hover over the line below to see the template parameters!
  # ============================================================
  - template: templates/build-dotnet.yml@templates
    parameters:
      project: '**/*.csproj'
      buildConfiguration: Release
      dotnetVersion: '8.0.x'
      publishArtifact: true

  # ============================================================
  # DEPLOY STAGE — also from the external repo
  # ============================================================
  - template: stages/deploy-stage.yml@templates
    parameters:
      environment: Production
      azureSubscription: Azure-Prod-ServiceConnection
      appName: myapp-prod-webapp
      dependsOn:
        - Build
