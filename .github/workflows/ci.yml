# CI: the same tests as a release (scripts/build.sh test: go vet + test, the
# VS Code E2E in a real VS Code, IntelliJ unit tests) on every push to main and
# every pull request, so a broken main shows up before a tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: gofmt
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "::error::not gofmt'ed: $unformatted"; exit 1; }

      - name: Test
        run: |
          scripts/build.sh dev
          xvfb-run -a scripts/build.sh test
